<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">SCARA_F103 控制系统关键接线图</title>
  <desc id="desc">简化黑白可编辑 SVG，使用电气工程图元件符号和端子表标注 STM32F103C8T6、DM556、HOME、UART、激光继电器的关键接线。</desc>
  <style>
    .bg { fill: #fff; }
    .box { fill: #fff; stroke: #000; stroke-width: 2; }
    .thinbox { fill: #fff; stroke: #000; stroke-width: 1.5; }
    .line { fill: none; stroke: #000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { fill: none; stroke: #000; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .pin { fill: #fff; stroke: #000; stroke-width: 2; }
    .dot { fill: #000; }
    text { fill: #000; font-family: "Microsoft YaHei", "Noto Sans CJK SC", "SimSun", Arial, sans-serif; letter-spacing: 0; }
    .title { font-size: 30px; font-weight: 700; }
    .sub { font-size: 15px; }
    .head { font-size: 20px; font-weight: 700; }
    .label { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; }
    .pintext { font-size: 14px; font-family: Consolas, "Courier New", monospace; }
    .center { text-anchor: middle; }
    .right { text-anchor: end; }
  </style>

  <rect class="bg" width="1600" height="1050"/>
  <text class="title" x="50" y="48">SCARA_F103 控制系统关键接线图</text>
  <text class="sub" x="50" y="76">黑白可编辑 SVG；用端子表和电气元件符号标注关键引脚，减少复杂交叉导线。</text>

  <!-- Left block: UART, home and SWD -->
  <g id="io-block">
    <rect class="box" x="50" y="110" width="430" height="480" rx="3"/>
    <text class="head center" x="265" y="145">通信 / 回零 / 烧录</text>

    <rect class="thinbox" x="80" y="175" width="160" height="90" rx="3"/>
    <text class="label center" x="160" y="205">USB-UART</text>
    <text class="pintext" x="102" y="232">TXD → PA10 RX</text>
    <text class="pintext" x="102" y="254">RXD ← PA9 TX</text>
    <text class="small" x="260" y="205">115200 8N1</text>
    <text class="small" x="260" y="230">TTL 3.3V</text>
    <text class="small" x="260" y="255">GND 共地</text>

    <text class="label" x="82" y="315">HOME1 常开触点</text>
    <circle class="pin" cx="130" cy="350" r="4"/>
    <circle class="pin" cx="245" cy="350" r="4"/>
    <path class="thin" d="M130 350 L218 318"/>
    <text class="small center" x="130" y="376">COM/GND</text>
    <text class="pintext center" x="245" y="376">NO → PB0</text>
    <path class="thin" d="M112 390 H148 M119 401 H141 M126 412 H134"/>

    <text class="label" x="82" y="455">HOME2 常开触点</text>
    <circle class="pin" cx="130" cy="490" r="4"/>
    <circle class="pin" cx="245" cy="490" r="4"/>
    <path class="thin" d="M130 490 L218 458"/>
    <text class="small center" x="130" y="516">COM/GND</text>
    <text class="pintext center" x="245" y="516">NO → PB1</text>
    <path class="thin" d="M112 530 H148 M119 541 H141 M126 552 H134"/>

    <rect class="thinbox" x="300" y="330" width="140" height="125" rx="3"/>
    <text class="label center" x="370" y="360">ST-LINK</text>
    <text class="pintext" x="322" y="388">SWDIO → PA13</text>
    <text class="pintext" x="322" y="412">SWCLK → PA14</text>
    <text class="pintext" x="322" y="436">Vref  → 3V3</text>
  </g>

  <!-- Center block: MCU pin map -->
  <g id="mcu-pin-map">
    <rect class="box" x="530" y="110" width="390" height="480" rx="3"/>
    <text class="head center" x="725" y="145">STM32F103C8T6 关键引脚</text>
    <text class="small center" x="725" y="168">当前程序 SCARA_F103</text>

    <text class="label" x="560" y="210">步进输出</text>
    <text class="pintext" x="570" y="238">PA8   → M1 PUL-   TIM1_CH1</text>
    <text class="pintext" x="570" y="263">PB12  → M1 DIR-</text>
    <text class="pintext" x="570" y="288">PB13  → M1 ENA-</text>
    <text class="pintext" x="570" y="323">PB6   → M2 PUL-   TIM4_CH1</text>
    <text class="pintext" x="570" y="348">PB7   → M2 DIR-</text>
    <text class="pintext" x="570" y="373">PB8   → M2 ENA-</text>

    <text class="label" x="560" y="425">输入 / 通信</text>
    <text class="pintext" x="570" y="453">PB0   ← HOME1 NO   内部上拉</text>
    <text class="pintext" x="570" y="478">PB1   ← HOME2 NO   内部上拉</text>
    <text class="pintext" x="570" y="503">PA9   → USART1_TX</text>
    <text class="pintext" x="570" y="528">PA10  ← USART1_RX</text>

    <text class="label" x="560" y="560">激光</text>
    <text class="pintext" x="650" y="560">PA7 → PWM；PA2 → 继电器 IN</text>
  </g>

  <!-- Right block: DM556 terminal wiring -->
  <g id="dm556-block">
    <rect class="box" x="970" y="110" width="580" height="480" rx="3"/>
    <text class="head center" x="1260" y="145">DM556 共阳接法</text>
    <text class="small center" x="1260" y="168">PUL+/DIR+/ENA+ 接 +5V_LOGIC；STM32 开漏脚接负端，低电平有效</text>

    <rect class="thinbox" x="1000" y="205" width="250" height="275" rx="3"/>
    <text class="label center" x="1125" y="235">M1 驱动器</text>
    <text class="pintext" x="1025" y="270">PUL+  → +5V</text>
    <text class="pintext" x="1025" y="295">PUL-  ← PA8</text>
    <text class="pintext" x="1025" y="330">DIR+  → +5V</text>
    <text class="pintext" x="1025" y="355">DIR-  ← PB12</text>
    <text class="pintext" x="1025" y="390">ENA+  → +5V</text>
    <text class="pintext" x="1025" y="415">ENA-  ← PB13</text>
    <text class="pintext" x="1025" y="455">VDC+/- → 24-48V</text>
    <circle class="pin" cx="1188" cy="295" r="4"/>
    <circle class="pin" cx="1218" cy="295" r="4"/>
    <path class="thin" d="M1188 295 q15 -22 30 0"/>
    <text class="small" x="1170" y="325">57 步进 M1</text>

    <rect class="thinbox" x="1280" y="205" width="250" height="275" rx="3"/>
    <text class="label center" x="1405" y="235">M2 驱动器</text>
    <text class="pintext" x="1305" y="270">PUL+  → +5V</text>
    <text class="pintext" x="1305" y="295">PUL-  ← PB6</text>
    <text class="pintext" x="1305" y="330">DIR+  → +5V</text>
    <text class="pintext" x="1305" y="355">DIR-  ← PB7</text>
    <text class="pintext" x="1305" y="390">ENA+  → +5V</text>
    <text class="pintext" x="1305" y="415">ENA-  ← PB8</text>
    <text class="pintext" x="1305" y="455">VDC+/- → 24-48V</text>
    <circle class="pin" cx="1468" cy="295" r="4"/>
    <circle class="pin" cx="1498" cy="295" r="4"/>
    <path class="thin" d="M1468 295 q15 -22 30 0"/>
    <text class="small" x="1450" y="325">57 步进 M2</text>
  </g>

  <!-- Bottom block: laser chain -->
  <g id="laser-block">
    <rect class="box" x="50" y="640" width="1500" height="330" rx="3"/>
    <text class="head center" x="800" y="675">激光 PWM 与继电器断电链路</text>
    <text class="small center" x="800" y="700">PA7 只控制 PWM；激光主电源必须经过保险、实体急停和继电器 COM/NO 常开触点。</text>

    <!-- Control side -->
    <text class="label" x="85" y="750">控制侧</text>
    <rect class="thinbox" x="85" y="775" width="130" height="45" rx="2"/>
    <text class="pintext center" x="150" y="803">PA7 / PWM</text>
    <path class="line" d="M215 798 H285"/>
    <rect class="thinbox" x="285" y="770" width="160" height="55" rx="3"/>
    <text class="label center" x="365" y="797">电平转换</text>
    <text class="small center" x="365" y="817">必要时使用</text>
    <path class="line" d="M445 798 H575"/>
    <text class="pintext" x="460" y="785">→ 激光 PWM input</text>

    <rect class="thinbox" x="85" y="850" width="130" height="45" rx="2"/>
    <text class="pintext center" x="150" y="878">PA2 / RELAY</text>
    <path class="line" d="M215 873 H285"/>
    <rect class="thinbox" x="285" y="845" width="160" height="55" rx="3"/>
    <text class="label center" x="365" y="872">继电器线圈 K1</text>
    <text class="small center" x="365" y="892">IN 高有效</text>

    <!-- Power side -->
    <text class="label" x="640" y="750">激光主电源侧</text>
    <text class="label" x="645" y="805">+12V</text>
    <path class="line" d="M700 800 H760"/>
    <rect class="thinbox" x="760" y="780" width="80" height="40" rx="2"/>
    <text class="small center" x="800" y="805">保险</text>
    <path class="line" d="M840 800 H900"/>
    <circle class="pin" cx="915" cy="800" r="4"/>
    <circle class="pin" cx="995" cy="800" r="4"/>
    <path class="thin" d="M915 800 L995 800"/>
    <text class="small center" x="955" y="780">实体急停</text>
    <path class="line" d="M995 800 H1070"/>
    <circle class="pin" cx="1085" cy="800" r="4"/>
    <circle class="pin" cx="1180" cy="800" r="4"/>
    <path class="thin" d="M1085 800 L1150 770"/>
    <text class="small center" x="1132" y="770">K1 常开触点</text>
    <text class="small" x="1077" y="825">COM</text>
    <text class="small" x="1172" y="825">NO</text>
    <path class="line" d="M1180 800 H1270"/>

    <rect class="thinbox" x="1270" y="745" width="220" height="140" rx="3"/>
    <text class="label center" x="1380" y="775">激光模块</text>
    <text class="pintext" x="1295" y="810">+12V red</text>
    <text class="pintext" x="1295" y="840">GND black → GND</text>
    <text class="pintext" x="1295" y="870">PWM input ← PA7</text>

    <path class="line" d="M1270 840 H1220"/>
    <path class="thin" d="M1200 840 H1240 M1207 852 H1233 M1214 864 H1226"/>

    <text class="small" x="640" y="925">注意：继电器触点用 COM/NO，不使用 NC；PA7 不能替代实体断电保护。</text>
  </g>

  <text class="small" x="60" y="1018">来源：SCARA_F103/Core/Inc/main.h、Core/Src/gpio.c/tim.c/usart.c、UserApp/app_config.h、Control.md。</text>
</svg>
